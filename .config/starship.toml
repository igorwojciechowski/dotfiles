command_timeout = 1500

format = """
[╭─](fg:bright_black)[](fg:black)$os$username$hostname[](fg:black bg:bright_black)$directory[](fg:bright_black bg:black)$git_branch$git_status$fill$time
[╰─](fg:bright_black)$nodejs$python$golang$rust$custom$cmd_duration$jobs
  $character
"""

right_format = ""

[fill]
symbol = " "
style = "fg:bright_black"

[os]
disabled = false
format = "[ $symbol ]($style)"
style = "bg:black fg:bright_cyan bold"

[os.symbols]
Macos = ""
Kali = ""
Ubuntu = ""
Windows = ""

[username]
show_always = true
format = "[$user]($style)"
style_user = "bg:black fg:bright_cyan bold"
style_root = "bg:red fg:black bold"

[hostname]
ssh_only = false
format = "[ @$hostname ]($style)"
style = "bg:black fg:cyan"

[directory]
format = "[ 󰉋 $path ]($style)"
style = "bg:bright_black fg:cyan bold"
truncation_length = 4
truncation_symbol = ".../"

[git_branch]
symbol = ""
format = "[  $branch ]($style)"
style = "bg:black fg:bright_cyan bold"
truncation_length = 28

[git_status]
format = "[ $all_status ]($style)"
style = "bg:black fg:cyan"

[time]
disabled = false
time_format = "%H:%M"
format = "[ 󱑆 $time ]($style)"
style = "bg:cyan fg:black bold"

[cmd_duration]
min_time = 800
format = "[ 󱫑 $duration ]($style)"
style = "bg:bright_black fg:bright_cyan"

[jobs]
disabled = false
number_threshold = 1
format = "[ 󰣖 $number ]($style)"
style = "bg:bright_black fg:cyan"

[status]
disabled = false
format = "[ ✖ $status ]($style)"
style = "bg:red fg:black bold"

[character]
success_symbol = "[❯](fg:bright_cyan bold)"
error_symbol = "$status[❯](fg:red bold)"
vimcmd_symbol = "[<<<](fg:bright_black bold)"

[custom.tun]
command = "ifconfig tun0 2>/dev/null | awk '/inet / {print $2; exit}'"
when = "ifconfig tun0 >/dev/null 2>&1"
format = "[ 󰖂 $output ]($style)"
style = "bg:bright_black fg:bright_cyan bold"

[python]
format = "[  $version ]($style)"
style = "bg:bright_black fg:bright_cyan"

[nodejs]
format = "[  $version ]($style)"
style = "bg:bright_black fg:bright_cyan"

[golang]
format = "[  $version ]($style)"
style = "bg:bright_black fg:bright_cyan"

[rust]
format = "[  $version ]($style)"
style = "bg:bright_black fg:bright_cyan"
